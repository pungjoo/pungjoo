<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>점심 메뉴 룰렛</title>
  <script src="/_rum/v1/loader.js" async></script>
  <style>
    :root { --bg: #faf7f2; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665e; --accent: #e8590c; --line: #e7e1d8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --card: #211f1c; --ink: #f3efe9; --muted: #a59f96; --accent: #ff8a3d; --line: #35322d; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
           border-radius: 16px; padding: 28px 24px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .chips label { cursor: pointer; }
    .chips input { position: absolute; opacity: 0; }
    .chips span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: .9rem; }
    .chips input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    #result { min-height: 96px; display: grid; place-items: center; margin-bottom: 20px; }
    #name { font-size: 2.2rem; font-weight: 700; }
    #cat { color: var(--muted); font-size: .9rem; margin-top: 4px; }
    #name.spin { opacity: .55; }
    button { font: inherit; font-weight: 600; font-size: 1.05rem; padding: 12px 28px; border: 0; border-radius: 12px;
             background: var(--accent); color: #fff; cursor: pointer; width: 100%; }
    button:disabled { opacity: .6; cursor: wait; }
    small { display: block; margin-top: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>🍱 점심 메뉴 룰렛</h1>
    <p class="sub">고민은 그만, 오늘 점심은 룰렛이 정해드려요.</p>
    <div class="chips" id="chips" aria-label="카테고리"></div>
    <div id="result" aria-live="polite">
      <div><div id="name">?</div><div id="cat">카테고리를 고르고 돌려보세요 (안 고르면 전체)</div></div>
    </div>
    <button id="spin">룰렛 돌리기</button>
    <small id="meta"></small>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let names = [];

    async function init() {
      const { categories } = await (await fetch('/api/categories')).json();
      $('chips').innerHTML = categories
        .map((c) => `<label><input type="checkbox" value="${c}"><span>${c}</span></label>`).join('');
      names = ['김치찌개', '짜장면', '초밥', '파스타', '떡볶이', '쌀국수', '돈카츠', '비빔밥'];
    }

    async function spin() {
      const btn = $('spin');
      btn.disabled = true;
      const params = new URLSearchParams();
      document.querySelectorAll('#chips input:checked').forEach((el) => params.append('category', el.value));
      const req = fetch('/api/pick?' + params).then((r) => r.json());
      $('name').classList.add('spin');
      for (let i = 0; i < 14; i++) {
        $('name').textContent = names[i % names.length];
        await sleep(40 + i * 12);
      }
      try {
        const { pick, candidates } = await req;
        $('name').textContent = pick.name;
        $('cat').textContent = pick.category;
        $('meta').textContent = `후보 ${candidates}개 중에서 골랐어요`;
      } catch {
        $('name').textContent = '앗!';
        $('cat').textContent = '서버에 연결하지 못했어요. 다시 시도해 주세요.';
      }
      $('name').classList.remove('spin');
      btn.disabled = false;
    }

    $('spin').addEventListener('click', spin);
    init();
  </script>
</body>
</html>
